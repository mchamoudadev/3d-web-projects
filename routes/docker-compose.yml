name: muqdisho3d
services:
  osrm:
    image: ghcr.io/project-osrm/osrm-backend@sha256:8a1b1bc938412f15f9b5b32d794c4ec6bf4a85dfbbabfa0a014b70b187edb53b
    command: osrm-routed --algorithm mld --threads 4 /data/mogadishu.osrm
    ports:
      - "127.0.0.1:${OSRM_PORT:-5000}:5000"
    volumes:
      - ./data/osrm:/data:ro
    restart: unless-stopped
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: muqdisho
      POSTGRES_USER: muqdisho
      POSTGRES_PASSWORD: "${PGPASSWORD:?Set PGPASSWORD in your shell before starting Postgres}"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - places:/var/lib/postgresql/data
      - ./scripts/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muqdisho -d muqdisho"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  places:
